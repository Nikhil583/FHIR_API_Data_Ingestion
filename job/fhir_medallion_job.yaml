          notebook_task:
            notebook_path: /Workspace/Users/nikhil.srivastava@team.telstra.com/FHIR/notebooks/03_silver_to_gold
            source: WORKSPACE
          existing_cluster_id: 0602-140722-x992npug
          max_retries: 2
          timeout_seconds: 7200

