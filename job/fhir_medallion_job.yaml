    fhir_api_databricks_job:
      name: fhir-api-databricks-job

      format: MULTI_TASK

      max_concurrent_runs: 1

      tasks:
        - task_key: ingest_raw_bronze
          notebook_task:
            notebook_path: /Workspace/Users/nikhil.srivastava@team.telstra.com/FHIR/notebooks/01_ingest_raw_to_bronze
            source: WORKSPACE
          existing_cluster_id: 0602-140722-x992npug
          max_retries: 2
          timeout_seconds: 7200

